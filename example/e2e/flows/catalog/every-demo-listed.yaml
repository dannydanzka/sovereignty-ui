# Every native-ready export has its row in the catalog. Each demo is rendered by jest
# (demos.test.tsx); this proves the rows reach the device's accessibility tree.
appId: com.example
name: catalog/every-demo-listed
tags:
  - smoke
---
- launchApp:
    clearState: true
- scrollUntilVisible:
